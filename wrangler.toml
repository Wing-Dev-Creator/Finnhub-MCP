name = "equity-intel-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object binding required by the agents/McpAgent pattern.
# It holds per-session MCP state (transport, server lifecycle).
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "EquityIntelMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EquityIntelMCP"]

# Secrets (set each with `wrangler secret put <NAME>`):
#   FINNHUB_API_KEY  — required for Finnhub tools. Get one free at https://finnhub.io/register
#   SEC_USER_AGENT   — required for the sec_filings_recent tool. Format: "AppName your.email@example.com"
#                      SEC EDGAR uses this to identify and contact you if your script misbehaves.
#                      Without it, SEC returns HTTP 403.
[vars]
USER_AGENT = "equity-intel-mcp (github.com/YOUR_USERNAME/equity-intel-mcp)"
